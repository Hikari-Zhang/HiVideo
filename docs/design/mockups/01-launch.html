<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HiVideo · 启动屏</title>
<link rel="stylesheet" href="tokens.css">
<style>
  .launch-screen {
    height: calc(100vh - 40px);
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: var(--sp-xl);
    background: var(--surface-background);
    position: relative;
  }
  /* 背景噪点纹理模拟 */
  .launch-screen::before {
    content: '';
    position: absolute; inset: 0;
    background: radial-gradient(ellipse at 50% 30%, rgba(10,132,255,0.05) 0%, transparent 60%);
    pointer-events: none;
  }
  .app-icon {
    width: 80px; height: 80px; border-radius: 18px;
    background: linear-gradient(145deg, #0A84FF, #BF5AF2);
    display: flex; align-items: center; justify-content: center;
    font-size: 40px; line-height: 1;
    box-shadow: var(--shadow-md);
  }
  .app-name { font-size: 34px; font-weight: 300; letter-spacing: -0.5px; }
  .tagline  { color: var(--text-secondary); }
  /* 拖放区 */
  .drop-zone {
    border: 1.5px dashed var(--border-strong);
    border-radius: var(--r-xl);
    padding: var(--sp-xxl) var(--sp-xxxl);
    text-align: center;
    cursor: pointer;
    transition: var(--anim-default);
    min-width: 480px;
  }
  .drop-zone:hover,
  .drop-zone.drag-over {
    border-color: var(--accent);
    background: rgba(10,132,255,0.05);
  }
  .drop-icon { font-size: 32px; margin-bottom: var(--sp-sm); color: var(--text-tertiary); }
  .drop-primary { font-size: 16px; font-weight: 500; margin-bottom: var(--sp-xxs); }
  .drop-hint { font-size: 13px; color: var(--text-tertiary); }
  .shortcut {
    display: inline-block; margin-top: var(--sp-sm);
    background: var(--surface-secondary);
    border: 0.5px solid var(--border-default);
    border-radius: var(--r-sm);
    padding: 3px 8px; font-size: 12px; color: var(--text-secondary);
  }
  /* 最近播放 */
  .recent-section { text-align: center; width: 100%; max-width: 560px; }
  .recent-title { font-size: 12px; color: var(--text-tertiary); margin-bottom: var(--sp-sm); text-transform: uppercase; letter-spacing: 0.05em; }
  .recent-cards { display: flex; gap: var(--sp-md); justify-content: center; }
  .poster-sm {
    width: 80px; cursor: pointer;
    transition: var(--anim-default);
  }
  .poster-sm:hover { transform: translateY(-3px); }
  .poster-img {
    width: 80px; height: 120px; border-radius: var(--r-md);
    object-fit: cover; background: var(--surface-secondary);
    border: 0.5px solid var(--border-default);
    display: flex; align-items: center; justify-content: center;
    font-size: 28px; color: var(--text-tertiary);
    margin-bottom: 6px;
  }
  .poster-label { font-size: 11px; color: var(--text-secondary); text-align: center; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
</style>
</head>
<body>
<nav class="mockup-nav">
  <a class="nav-home" href="index.html">Mockups</a>
  <span class="separator">/</span>
  <span class="current">01 · 启动屏</span>
</nav>
<div class="mockup-body">
<div class="launch-screen">
  <div class="app-icon">▶</div>
  <div>
    <div class="app-name" style="text-align:center">HiVideo</div>
    <div class="tagline t-callout" style="text-align:center">打开就能用，看完就懂你</div>
  </div>

  <div class="drop-zone" id="dropZone"
    ondragover="this.classList.add('drag-over');event.preventDefault()"
    ondragleave="this.classList.remove('drag-over')"
    ondrop="this.classList.remove('drag-over');event.preventDefault()">
    <div class="drop-icon">⬆</div>
    <div class="drop-primary">拖入视频文件或文件夹</div>
    <div class="drop-hint">支持 MKV、MP4、MOV、AVI、H.264、H.265、AV1</div>
    <span class="shortcut">⌘O 选择文件</span>
  </div>

  <div class="recent-section">
    <div class="recent-title">最近播放</div>
    <div class="recent-cards">
      <div class="poster-sm">
        <div class="poster-img">🎌</div>
        <div class="poster-label">四月是你的谎言</div>
      </div>
      <div class="poster-sm">
        <div class="poster-img">🦸</div>
        <div class="poster-label">复仇者联盟</div>
      </div>
      <div class="poster-sm">
        <div class="poster-img">🎭</div>
        <div class="poster-label">老男孩</div>
      </div>
    </div>
  </div>
</div>
</div>
</body>
</html>
