<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<title>HiVideo · 画质增强 + 音频增强</title>
<link rel="stylesheet" href="tokens.css">
<style>
  body { overflow-y: auto; height: auto; }
  .demo-wrap {
    min-height: calc(100vh - 40px); display: flex; gap: var(--sp-xxl);
    padding: var(--sp-xxl); align-items: flex-start; justify-content: center;
    background: var(--surface-background);
  }
  .panel {
    width: 320px; background: rgba(44,44,46,0.95);
    backdrop-filter: blur(40px);
    border: 0.5px solid var(--border-strong);
    border-radius: var(--r-xl);
    box-shadow: var(--shadow-lg); overflow: hidden;
  }
  .panel-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: var(--sp-md) var(--sp-md);
    border-bottom: 0.5px solid var(--border-default);
  }
  .panel-title { font-size: 15px; font-weight: 600; display:flex;align-items:center;gap:6px; }
  .panel-body { padding: var(--sp-sm) var(--sp-md); }
  .preset-row {
    display:flex; align-items:center; gap:var(--sp-xs);
    padding: var(--sp-xs) 0; border-bottom:0.5px solid var(--border-default);
    margin-bottom:var(--sp-xs);
  }
  .preset-name { font-size:14px; font-weight:500; flex:1; }
  /* 滤镜行 */
  .filter-row {
    padding: var(--sp-xs) 0;
    border-bottom: 0.5px solid var(--border-default);
  }
  .filter-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:4px; }
  .filter-name { font-size:14px; }
  .filter-model { font-size:11px; color:var(--text-tertiary); }
  .filter-slider { display:none; }
  .filter-row.on .filter-slider { display:block; margin-top:var(--sp-xs); }
  .filter-row.disabled { opacity:0.5; }
  .download-link { font-size:12px; color:var(--accent); cursor:pointer; }
  /* 性能仪表 */
  .perf-section { padding: var(--sp-sm) 0; }
  .perf-title { font-size:11px; color:var(--text-tertiary); text-transform:uppercase; letter-spacing:0.05em; margin-bottom:var(--sp-xs); }
  .perf-row { display:flex; align-items:center; gap:var(--sp-xs); margin-bottom:var(--sp-xs); }
  .perf-label { font-size:12px; color:var(--text-secondary); width:52px; flex-shrink:0; }
  .perf-bar { flex:1; height:4px; background:var(--surface-secondary); border-radius:var(--r-full); overflow:hidden; }
  .perf-fill { height:100%; border-radius:var(--r-full); }
  .perf-val { font-size:11px; color:var(--text-tertiary); width:40px; text-align:right; flex-shrink:0; font-variant-numeric:tabular-nums; }
  /* 音频面板专用 */
  .radio-group { display:flex; gap:var(--sp-xs); flex-wrap:wrap; }
  .radio-opt {
    display:flex; align-items:center; gap:4px;
    padding:5px var(--sp-xs); border-radius:var(--r-sm);
    border:0.5px solid var(--border-default);
    cursor:pointer; font-size:13px;
    transition:background 0.1s;
  }
  .radio-opt:hover { background:var(--state-hover); }
  .radio-opt.selected { border-color:var(--accent); background:rgba(10,132,255,0.1); color:var(--accent); }
  /* 电平表 */
  .level-meter {
    background:var(--surface-secondary); border-radius:var(--r-md);
    padding:var(--sp-sm); margin-top:var(--sp-xs);
  }
  .level-row { display:flex; align-items:center; gap:var(--sp-xs); margin-bottom:4px; }
  .level-ch { font-size:11px; color:var(--text-tertiary); width:12px; flex-shrink:0; }
  .level-bar {
    flex:1; height:6px; background:var(--surface-primary);
    border-radius:var(--r-full); overflow:hidden;
  }
  .level-fill {
    height:100%; border-radius:var(--r-full);
    background:linear-gradient(to right,var(--functional-success),var(--functional-warning) 80%,var(--functional-error));
    transition:width 0.1s;
  }
  .level-val { font-size:11px; color:var(--text-secondary); width:56px; text-align:right; font-variant-numeric:tabular-nums; flex-shrink:0; }
  .lufs { font-size:12px; color:var(--text-secondary); text-align:center; margin-top:4px; }
</style>
</head>
<body>
<nav class="mockup-nav">
  <a class="nav-home" href="index.html">Mockups</a>
  <span class="separator">/</span>
  <span class="current">08-09 · 画质增强 + 音频增强</span>
</nav>
<div class="mockup-body" style="overflow:auto">
<div class="demo-wrap">

  <!-- ── 画质增强浮窗 ── -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">✨ 画质增强</div>
      <button class="btn-icon" style="font-size:16px">✕</button>
    </div>
    <div class="panel-body">
      <div class="preset-row">
        <span class="preset-name">老片救星</span>
        <button class="btn btn-ghost btn-sm">切换预设 ∨</button>
      </div>

      <!-- 超分 -->
      <div class="filter-row on" id="fr-esrgan">
        <div class="filter-top">
          <div><div class="filter-name">超分辨率</div><div class="filter-model">RealESRGAN 4×</div></div>
          <label class="toggle"><input type="checkbox" checked onchange="toggleFilter('fr-esrgan',this)"><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div class="filter-slider">
          <div class="slider-wrap"><span style="font-size:11px;color:var(--text-tertiary)">强度</span><input type="range" min="0" max="100" value="80"><span style="font-size:11px;color:var(--text-secondary);width:28px;text-align:right">80%</span></div>
        </div>
      </div>

      <!-- 降噪 -->
      <div class="filter-row on" id="fr-nafnet">
        <div class="filter-top">
          <div><div class="filter-name">降噪</div><div class="filter-model">NAFNet</div></div>
          <label class="toggle"><input type="checkbox" checked onchange="toggleFilter('fr-nafnet',this)"><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div class="filter-slider">
          <div class="slider-wrap"><span style="font-size:11px;color:var(--text-tertiary)">强度</span><input type="range" min="0" max="100" value="50"><span style="font-size:11px;color:var(--text-secondary);width:28px;text-align:right">50%</span></div>
        </div>
      </div>

      <!-- 锐化 -->
      <div class="filter-row on" id="fr-cas">
        <div class="filter-top">
          <div><div class="filter-name">锐化</div><div class="filter-model">CAS</div></div>
          <label class="toggle"><input type="checkbox" checked onchange="toggleFilter('fr-cas',this)"><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div class="filter-slider">
          <div class="slider-wrap"><span style="font-size:11px;color:var(--text-tertiary)">强度</span><input type="range" min="0" max="100" value="40"><span style="font-size:11px;color:var(--text-secondary);width:28px;text-align:right">40%</span></div>
        </div>
      </div>

      <!-- 插帧（未下载） -->
      <div class="filter-row disabled" id="fr-rife">
        <div class="filter-top">
          <div><div class="filter-name">插帧 60fps</div><div class="filter-model">RIFE v4.6</div></div>
          <label class="toggle"><input type="checkbox" disabled><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div style="margin-top:4px"><span class="download-link">↓ 下载模型（45 MB）</span></div>
      </div>

      <!-- 性能仪表 -->
      <div class="perf-section">
        <div class="perf-title">性能</div>
        <div class="perf-row">
          <span class="perf-label">GPU</span>
          <div class="perf-bar"><div class="perf-fill" style="width:72%;background:var(--accent)"></div></div>
          <span class="perf-val">72%</span>
        </div>
        <div class="perf-row">
          <span class="perf-label">帧延迟</span>
          <div class="perf-bar"><div class="perf-fill" style="width:55%;background:var(--functional-warning)"></div></div>
          <span class="perf-val">245ms</span>
        </div>
        <div class="perf-row">
          <span class="perf-label">温度</span>
          <div class="perf-bar"><div class="perf-fill" style="width:46%;background:var(--functional-success)"></div></div>
          <span class="perf-val">68°C</span>
        </div>
      </div>

      <div style="display:flex;gap:var(--sp-xs);padding-top:var(--sp-xs)">
        <button class="btn btn-secondary btn-sm" style="flex:1">应用预设 ∨</button>
        <button class="btn btn-ghost btn-sm">重置</button>
      </div>
    </div>
  </div>

  <!-- ── 音频增强浮窗 ── -->
  <div class="panel">
    <div class="panel-header">
      <div class="panel-title">🔊 音频增强</div>
      <button class="btn-icon" style="font-size:16px">✕</button>
    </div>
    <div class="panel-body">

      <!-- 响度归一化 -->
      <div class="filter-row on" id="fr-loudness">
        <div class="filter-top">
          <div class="filter-name">响度归一化</div>
          <label class="toggle"><input type="checkbox" checked onchange="toggleFilter('fr-loudness',this)"><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div class="filter-slider">
          <div style="display:flex;align-items:center;gap:var(--sp-xs);margin-top:var(--sp-xs)">
            <span style="font-size:12px;color:var(--text-secondary)">目标响度</span>
            <select style="background:var(--surface-secondary);border:0.5px solid var(--border-default);border-radius:var(--r-sm);color:var(--text-primary);font-size:13px;padding:3px var(--sp-xs);outline:none">
              <option>-23 LUFS（广播）</option>
              <option selected>-16 LUFS（流媒体）</option>
              <option>-14 LUFS（YouTube）</option>
            </select>
          </div>
        </div>
      </div>

      <!-- 对话增强 -->
      <div class="filter-row on" id="fr-dialogue">
        <div class="filter-top">
          <div class="filter-name">对话增强</div>
          <label class="toggle"><input type="checkbox" checked onchange="toggleFilter('fr-dialogue',this)"><div class="toggle-track"></div><div class="toggle-thumb"></div></label>
        </div>
        <div class="filter-slider">
          <div class="slider-wrap"><span style="font-size:11px;color:var(--text-tertiary)">增益</span><input type="range" min="3" max="12" value="6"><span style="font-size:11px;color:var(--text-secondary);width:36px;text-align:right">+6 dB</span></div>
        </div>
      </div>

      <!-- 深夜模式 -->
      <div class="filter-row">
        <div class="filter-name" style="margin-bottom:var(--sp-xs)">深夜模式</div>
        <div class="radio-group">
          <div class="radio-opt selected" onclick="selectRadio(this)">关闭</div>
          <div class="radio-opt" onclick="selectRadio(this)">轻度</div>
          <div class="radio-opt" onclick="selectRadio(this)">中度</div>
          <div class="radio-opt" onclick="selectRadio(this)">深夜</div>
        </div>
      </div>

      <!-- 设备预设 -->
      <div class="filter-row">
        <div style="display:flex;align-items:center;justify-content:space-between">
          <span class="filter-name">设备预设</span>
          <select style="background:var(--surface-secondary);border:0.5px solid var(--border-default);border-radius:var(--r-sm);color:var(--text-primary);font-size:13px;padding:3px var(--sp-xs);outline:none">
            <option>笔记本扬声器</option>
            <option selected>AirPods Pro</option>
            <option>外接音箱</option>
            <option>学外语模式</option>
          </select>
        </div>
        <div style="font-size:11px;color:var(--text-tertiary);margin-top:4px">当前：AirPods Pro</div>
      </div>

      <!-- 电平表 -->
      <div class="perf-section">
        <div class="perf-title">实时电平</div>
        <div class="level-meter">
          <div class="level-row">
            <span class="level-ch">L</span>
            <div class="level-bar"><div class="level-fill" id="levelL" style="width:70%"></div></div>
            <span class="level-val">-6 dBFS</span>
          </div>
          <div class="level-row">
            <span class="level-ch">R</span>
            <div class="level-bar"><div class="level-fill" id="levelR" style="width:65%"></div></div>
            <span class="level-val">-7 dBFS</span>
          </div>
          <div class="lufs">LUFS: -14.2 (short-term)</div>
        </div>
      </div>
    </div>
  </div>
</div>
</div>
<script>
function toggleFilter(id, input) {
  document.getElementById(id).classList.toggle('on', input.checked);
}
function selectRadio(el) {
  el.parentElement.querySelectorAll('.radio-opt').forEach(r=>r.classList.remove('selected'));
  el.classList.add('selected');
}
// 模拟电平表跳动
setInterval(()=>{
  const l = 50 + Math.random()*40;
  const r = 48 + Math.random()*40;
  document.getElementById('levelL').style.width = l+'%';
  document.getElementById('levelR').style.width = r+'%';
}, 200);
</script>
</body>
</html>
