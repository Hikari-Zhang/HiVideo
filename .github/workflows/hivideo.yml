name: HiVideo CI

on:
  push:
    paths:
      - 'hipixel-app/HiVideo/**'
      - '.github/workflows/hivideo.yml'
  pull_request:
    paths:
      - 'hipixel-app/HiVideo/**'

defaults:
  run:
    working-directory: hipixel-app/HiVideo

jobs:
  build:
    name: Build (macOS 14 / Apple Silicon)
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode
        run: sudo xcode-select -s /Applications/Xcode.app

      - name: Resolve Swift Packages
        run: xcodebuild -resolvePackageDependencies -scheme HiVideo

      - name: Build (Release)
        run: |
          xcodebuild build \
            -scheme HiVideo \
            -configuration Release \
            -destination "platform=macOS,arch=arm64" \
            CODE_SIGNING_ALLOWED=NO \
            | xcpretty || true

      - name: Run Package Tests (PlaybackKit)
        run: |
          swift test \
            --package-path Packages/PlaybackKit \
            --filter PlaybackKitTests

      - name: Run Package Tests (MediaKit)
        run: |
          swift test \
            --package-path Packages/MediaKit \
            --filter MediaKitTests
